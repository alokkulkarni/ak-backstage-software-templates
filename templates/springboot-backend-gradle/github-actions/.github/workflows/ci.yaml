name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build, Test and push to docker hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{values.java_version}}
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '${{values.java_version}}'
      
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew build
      
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew build sonar --info

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

       - name: Build amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{values.org_owner}}/${{values.artifact_id}}:amd64 \
            .
      - name: Build arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ${{values.org_owner}}/${{values.artifact_id}}:arm64 \
            .
      - name: Push both images
        run: |
          docker push ${{values.org_owner}}/${{values.artifact_id}}:amd64
          docker push ${{values.org_owner}}/${{values.artifact_id}}:arm64
      - name: Create and push manifest
        run: |
          docker manifest create ${{values.org_owner}}/${{values.artifact_id}}:latest \
            --amend ${{values.org_owner}}/${{values.artifact_id}}:amd64 \
            --amend ${{values.org_owner}}/${{values.artifact_id}}:arm64
          docker manifest push ${{values.org_owner}}/${{values.artifact_id}}:latest